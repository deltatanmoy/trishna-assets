var V={};
V.me=function(){var c=C;
  if(!c){$('#v').innerHTML='<div class="card"><h1>আপনি Refer &amp; Earn পার্টনার</h1><p class="note">নিজের বাড়ি/দোকানে সোলার নিয়ে জানতে চান? প্রোফাইল তৈরি করুন—আমাদের টিম যোগাযোগ করবে।</p><form id="sf"><label>ঠিকানা</label><input id="a1" maxlength="300"><div class="row"><div><label>জেলা</label><input id="a2" value="South Tripura"></div><div><label>মাসিক বিল ₹</label><input id="a3" type="number"></div></div><label class="chk"><input type="checkbox" id="a4" required><span>আমি সম্মত—আমার তথ্য সোলার পরামর্শের জন্য সংরক্ষিত হবে (অনুমোদন না হলে ৩০ দিনে মুছে যাবে)।</span></label><button class="btn">প্রোফাইল তৈরি করুন</button><div id="m"></div></form></div>';
    $('#sf').onsubmit=function(e){e.preventDefault();sb.rpc('customer_signup',{p_name:R.name,p_phone:R.phone,p_address:$('#a1').value,p_district:$('#a2').value,p_pincode:'',p_monthly_bill:$('#a3').value||null,p_interest:'unsure',p_use:'personal',p_consent:$('#a4').checked,p_ref:null}).then(function(x){x.error?$('#m').innerHTML='<div class="err">'+esc(x.error.message)+'</div>':home();});};return;}

  var st=c.approval_status==='approved'?'<span class="pill g">অনুমোদিত ✔</span>':c.approval_status==='rejected'?'<span class="pill r">বাতিল</span>':'<span class="pill y">অনুমোদনের অপেক্ষায়</span>';

  var THOUGHTS=['আজ একটি ছোট ভালো কাজ করুন—নিজের জন্য বা অন্যের জন্য।','তাড়াহুড়োয় নয়, শান্ত মনে নেওয়া সিদ্ধান্ত বেশিদিন টেকে।','“না” শুনলে নিজেকে দোষ দেবেন না—পরের দরজা আপনার অপেক্ষায়।','শরীর সুস্থ থাকলে মন হালকা থাকে—আজ ১০ মিনিট হাঁটুন।','গ্রাহকের বিশ্বাস এক দিনে তৈরি হয় না, কিন্তু এক কথায় ভাঙতে পারে—সৎ থাকুন।','যে কাজ আপনি নিয়ন্ত্রণ করতে পারেন সেখানে মন দিন; বাকিটা ছেড়ে দিন।','একটি গভীর শ্বাস নিন। আপনি যথেষ্ট ভালো করছেন।','বিশ্রাম অলসতা নয়—এটি পরের কাজের জ্বালানি।','আজ কাউকে ধন্যবাদ জানান।','অন্যের সঙ্গে নয়, গতকালের নিজের সঙ্গে তুলনা করুন।','পরিবারকে সময় দেওয়াও কাজ—সম্পর্কই সবচেয়ে বড় সম্পদ।','সূর্য প্রতিদিন নতুন করে ওঠে—আজও নতুন শুরু করা যায়।','ছোট অভ্যাস, বড় পরিবর্তন—রোজ ৫ মিনিটই যথেষ্ট।','কঠিন সময়ে সাহায্য চাওয়া সাহসের কাজ।'];
