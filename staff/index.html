<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Trishna Staff Portal</title>
<style>
:root{--red:#b3261e;--red2:#7a1a14;--navy:#102b46;--blue:#164e78;--gold:#f4a900;--ivory:#fffaf0;--green:#16834b;--ink:#1f2a37;--mut:#64748b;--line:#eadfc8}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Noto Sans Bengali","Segoe UI",system-ui,sans-serif;background:var(--ivory);color:var(--ink);line-height:1.55}
button,input,select,textarea{font:inherit}
.hide{display:none!important}
/* login */
.lg{min-height:100dvh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 20% 10%,#fde8e6,transparent 45%),radial-gradient(circle at 90% 90%,#fff0cf,transparent 40%),var(--ivory)}
.lg-card{width:min(420px,100%);background:#fff;border-radius:22px;border-top:6px solid var(--red);box-shadow:0 20px 50px rgba(122,26,20,.18);padding:26px}
.lg-card h1{margin:0 0 4px;font-size:22px;color:var(--navy)}.lg-card .sub{color:var(--mut);margin:0 0 18px;font-size:14px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}.brand i{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--gold));display:grid;place-items:center;color:#fff;font-style:normal;font-size:22px}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px;color:#33475b}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid #d8c9a6;border-radius:12px;background:#fff;font-size:16px}
input:focus,select:focus,textarea:focus{outline:3px solid #f4a90055;border-color:var(--gold)}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;min-height:44px}
.btn.alt{background:#fff;color:var(--red2);border:1.5px solid var(--red)}.btn.gold{background:linear-gradient(135deg,#f4a900,#e59a00);color:#1b2b3a}.btn.green{background:linear-gradient(135deg,#16834b,#0f6b3f)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:13px;border-radius:10px}.btn[disabled]{opacity:.55;cursor:not-allowed}
.err{background:#fde8e6;color:#8a1c14;border-radius:10px;padding:9px 12px;margin-top:12px;font-size:14px}.okm{background:#e3f6ea;color:#0f5c36;border-radius:10px;padding:9px 12px;margin-top:12px;font-size:14px}
.note{font-size:12.5px;color:var(--mut);margin-top:14px}
/* shell */
.top{position:sticky;top:0;z-index:20;background:linear-gradient(100deg,var(--red2),var(--red) 65%,#c9791c);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:4px double #f4c96a}
.top b{font-size:16px}.top small{opacity:.9;display:block;font-size:12px}.sp{flex:1}
.badge{background:#fff2;border:1px solid #fff5;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:19;scrollbar-width:none}
.tabs button{flex:0 0 auto;border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:8px 14px;font-weight:700;cursor:pointer;color:var(--navy);min-height:40px}
.tabs button.on{background:var(--red);border-color:var(--red);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(16,43,70,.05)}
.card h2,.card h3{margin:0 0 10px;color:var(--navy);font-size:18px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:linear-gradient(145deg,#fff,#fff6e6);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:14px;padding:12px}
.stat small{color:var(--mut);display:block;font-weight:700}.stat b{font-size:24px;color:var(--navy)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 150px}
table{width:100%;border-collapse:collapse;font-size:14px}th{background:#fbf1dc;text-align:left;padding:9px;color:var(--red2);white-space:nowrap}td{padding:9px;border-bottom:1px solid #f1e8d3;vertical-align:top}
.scroll{overflow-x:auto}
.btn.red{background:#c0341d;color:#fff}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:800;background:#eef2f6;color:#475569}
.pill.g{background:#d9f5e4;color:#0f6b3f}.pill.r{background:#ffe3dc;color:#a52714}.pill.y{background:#fff1c9;color:#8a5a00}.pill.b{background:#dcecfa;color:#164e78}
.bar{height:10px;background:#f1e8d3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:99px}
.item{display:flex;gap:12px;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin:8px 0;background:#fffdf8}
.item p{margin:2px 0 0;color:var(--mut);font-size:13.5px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),#f1e8d3 0);display:grid;place-items:center}.ring span{width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;color:var(--navy);font-size:20px}
.modal{position:fixed;inset:0;background:#0008;z-index:50;display:grid;place-items:center;padding:14px}.modal>div{background:#fff;border-radius:20px;max-width:720px;width:100%;max-height:90dvh;overflow:auto;padding:18px;border-top:6px solid var(--red)}
.modal pre{white-space:pre-wrap;font:inherit}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:99;box-shadow:0 8px 24px #0005}
.lock{font-size:13px;color:#8a1c14;background:#fde8e6;border-radius:12px;padding:8px 12px;margin-bottom:12px}
@media(max-width:560px){.top{padding:9px 10px}.tabs{top:56px}th,td{padding:7px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ======= CONFIG (already filled for Trishna) ======= */
var CFG = {
  url: 'https://zqvxwossbgocmkxllnyq.supabase.co',
  key: 'sb_publishable_ixwubKhJbalcW3N9lVuySw_ExhqxBl6',
  api: 'https://trishna-staff-api.deltatanmoy.workers.dev/',   // admin-only helper (create employees)
  emailLocal: 'trishnapowersolution', emailDomain: 'gmail.com',
  site: 'https://trishnapowersolution.blogspot.com/'
};
/* ===================================================== */
var ROLE = {md:'ম্যানেজিং ডিরেক্টর · M.D.',owner:'মালিক · Owner',hr:'এইচআর · HR',finance:'ফাইন্যান্স · Finance',district_manager:'জেলা ম্যানেজার · District Manager',social_media_manager:'সোশ্যাল মিডিয়া ম্যানেজার',admin:'অ্যাডমিন · Admin', awareness_executive:'সোলার অ্যাওয়ারনেস এক্সিকিউটিভ', installation_technician:'সোলার ইনস্টলেশন টেকনিশিয়ান'};
var ROLE_S = {md:'M.D.',owner:'Owner',hr:'HR',finance:'Finance',district_manager:'District Manager',social_media_manager:'Social Media Manager',admin:'Admin', awareness_executive:'Awareness Executive', installation_technician:'Installation Technician'};
var CAT = {visit:'গ্রাহক ভিজিট',lead:'নতুন লিড',survey:'সাইট সার্ভে',installation:'ইনস্টলেশন',service:'সার্ভিস',training:'ট্রেনিং',other:'অন্যান্য'};
var STS = {planned:'পরিকল্পিত',in_progress:'চলছে',done:'সম্পন্ন',follow_up:'ফলো-আপ'};
var LVL={md:100,owner:90,hr:70,finance:70,district_manager:60,admin:50};
var FIELDR=['awareness_executive','installation_technician','social_media_manager'];
var STAGE={lead:'লিড',surveyed:'সার্ভে হয়েছে',quoted:'কোটেশন দেওয়া',confirmed:'কনফার্ম',installed:'ইনস্টল হয়েছে',closed:'সম্পন্ন',lost:'বাতিল'};
function lvl(){return LVL[me.role]||10;}
function isMgr(){return lvl()>=50;}
function canApprove(){return ['md','owner','hr','district_manager','admin'].indexOf(me.role)>=0;}
function canManage(r,d){if(me.role==='md')return true;if(me.role==='owner')return r!=='md'&&r!=='owner';if(me.role==='hr')return r==='admin'||FIELDR.indexOf(r)>=0;
  if(me.role==='district_manager')return FIELDR.indexOf(r)>=0&&(d||'')===(me.district||'');if(me.role==='admin')return FIELDR.indexOf(r)>=0;return false;}
function creatable(){return Object.keys(ROLE_S).filter(function(r){return canManage(r,me.district);});}
var sb, me, tab, S = {};
var $ = function(s,r){return (r||document).querySelector(s);};
function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function el(html){var d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;}
function toast(m){var t=el('<div class="toast">'+esc(m)+'</div>');document.body.appendChild(t);setTimeout(function(){t.remove();},2600);}
function ist(d){return new Date(d||Date.now()).toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});}   // YYYY-MM-DD in IST
function tm(t){return t?new Date(t).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'2-digit',minute:'2-digit'}):'—';}
function dt(d){return d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';}
function hrs(a,b){return a&&b?Math.max(0,(new Date(b)-new Date(a))/36e5):0;}
function hh(h){return h?Math.floor(h)+'h '+String(Math.round((h%1)*60)).padStart(2,'0')+'m':'—';}
function emailOf(u){return CFG.emailLocal+'+'+String(u).toLowerCase().trim()+'@'+CFG.emailDomain;}
function monthStart(ym){return ym+'-01';}
function monthEnd(ym){var p=ym.split('-'),d=new Date(+p[0],+p[1],0);return ym+'-'+String(d.getDate()).padStart(2,'0');}
function csv(name,rows){var t=rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\n');var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));a.download=name;a.click();}
function modal(html){var m=el('<div class="modal"><div>'+html+'</div></div>');m.addEventListener('click',function(e){if(e.target===m)m.remove();});document.body.appendChild(m);return m;}
function on(root,sel,ev,fn){var n=$(sel,root);if(n)n.addEventListener(ev,fn);}
function opts(o,sel){return Object.keys(o).map(function(k){return '<option value="'+k+'"'+(k===sel?' selected':'')+'>'+esc(o[k])+'</option>';}).join('');}
function api(action,body){
  return sb.auth.getSession().then(function(r){var tok=r.data.session&&r.data.session.access_token;
    return fetch(CFG.api,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify(Object.assign({action:action},body))});})
  .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'failed');return j;});});
}
function must(r){if(r.error)throw new Error(r.error.message);return r.data;}

/* ---------- boot ---------- */
function loadSb(cb){
  if(window.supabase){cb();return;}
  var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
  s.onload=cb;s.onerror=function(){$('#app').innerHTML='<div class="lg"><div class="lg-card"><h1>সংযোগ সমস্যা</h1><p>ইন্টারনেট দেখে আবার চেষ্টা করুন।</p></div></div>';};document.head.appendChild(s);
}
loadSb(function(){
  sb=window.supabase.createClient(CFG.url,CFG.key);
  sb.auth.getSession().then(function(r){if(r.data.session)enter();else loginView();});
});

/* ---------- login ---------- */
function loginView(msg){
  $('#app').innerHTML='<div class="lg"><form class="lg-card" id="lf"><video src="../media/logo-animation.mp4" poster="../media/logo-poster.jpg" autoplay muted loop playsinline style="width:100%;border-radius:12px;margin-bottom:10px;background:#000"></video><div class="brand"><i>☀</i><div><b>TRISHNA POWER SOLUTION</b><div class="sub" style="margin:0">স্টাফ পোর্টাল · Staff Portal</div></div></div>'
   +'<h1>লগইন</h1><p class="sub">শুধু অনুমোদিত কর্মী ও অ্যাডমিনদের জন্য। Authorised staff only.</p>'
   +'<label>ইউজারনেম · Username</label><input id="u" autocomplete="username" autocapitalize="none" required>'
   +'<label>পাসওয়ার্ড · Password</label><input id="p" type="password" autocomplete="current-password" required>'
   +(msg?'<div class="err">'+esc(msg)+'</div>':'')+'<div id="le"></div>'
   +'<button class="btn" style="width:100%;margin-top:16px" type="submit">লগইন করুন</button>'
   +'<p class="note">এই পোর্টালের তথ্য কোম্পানির অভ্যন্তরীণ ও গোপনীয়। পাসওয়ার্ড কাউকে জানাবেন না। <a href="'+CFG.site+'">← ওয়েবসাইটে ফিরুন</a></p></form></div>';
  $('#lf').addEventListener('submit',function(e){e.preventDefault();var b=$('#lf button');b.disabled=true;
    sb.auth.signInWithPassword({email:emailOf($('#u').value),password:$('#p').value}).then(function(r){
      if(r.error){$('#le').innerHTML='<div class="err">ইউজারনেম বা পাসওয়ার্ড ভুল।</div>';b.disabled=false;return;}
      enter();});});
}
function logout(){sb.auth.signOut().then(function(){me=null;S={};loginView();});}

function enter(){
  sb.auth.getSession().then(function(r){var uid=r.data.session&&r.data.session.user.id;
    return sb.from('profiles').select('*').eq('id',uid).maybeSingle();}).then(function(r){
    me=r.data;
    if(!me||!me.active){sb.auth.signOut().then(function(){loginView('এই অ্যাকাউন্টটি সক্রিয় নয়। অ্যাডমিনের সঙ্গে যোগাযোগ করুন।');});return;}
    shell();
  });
}

/* ---------- shell ---------- */
function limited(){return me.role==='awareness_executive'&&me.employment_type==='part_time';}
function freelance(){return me.role==='social_media_manager';}
function canPay(){return ['md','owner','hr','finance'].indexOf(me.role)>=0;}
function fdt(t){return t?new Date(t).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';}
function canSet(){return ['md','owner','finance'].indexOf(me.role)>=0;}
function tabsFor(){
  if(limited())return [['home','🏠 হোম'],['customers','🧾 আমার গ্রাহক'],['earn','💵 আমার আয়'],['messages','✉ মেসেজ'],['study','📚 স্টাডি'],['docs','📄 নীতি ও দায়িত্ব'],['idcard','🪪 ID কার্ড'],['me','👤 প্রোফাইল'],['locked','🔒 Full-Time ফিচার']];
  if(freelance())return [['home','🏠 হোম'],['messages','✉ মেসেজ'],['tasks','✅ টাস্ক'],['study','📚 স্টাডি'],['docs','📄 নীতি ও দায়িত্ব'],['idcard','🪪 ID কার্ড'],['me','👤 প্রোফাইল']];
  if(isMgr())return [['overview','📊 ওভারভিউ'],['customers','🧾 গ্রাহক'],['approvals','✅ অনুমোদন'],['refer','🎁 Refer & Earn'],['service','🛠 সার্ভিস রিকোয়েস্ট'],['employees','👥 কর্মী'],['attendance','🕒 হাজিরা'],['activities','📝 কার্যকলাপ'],['tasks','✅ টাস্ক'],['schedule','📅 সূচি'],['messages','✉ মেসেজ'],['leave','🌴 ছুটি'],['slips','💰 বেতন'],['earnmgr','💵 কমিশন'],['materials','📚 স্টাডি ম্যাটেরিয়াল'],['progress','📈 অগ্রগতি'],['docs','📄 নীতি ও দায়িত্ব']]
    .concat(canSet()?[['payset','⚙ বেতন কাঠামো']]:[]).concat(me.role==='md'||me.role==='owner'?[['audit','🔍 অডিট লগ']]:[]).concat([['idcard','🪪 ID কার্ড'],['me','👤 প্রোফাইল']]);
  return [['dash','🏠 ড্যাশবোর্ড'],['customers','🧾 আমার গ্রাহক'],['att','🕒 হাজিরা'],['act','📝 আমার কাজ'],['tasks','✅ টাস্ক'],['schedule','📅 সূচি'],['messages','✉ মেসেজ'],['leave','🌴 ছুটি']]
    .concat(me.role==='installation_technician'?[['earn','💵 আমার আয়']]:[]).concat(me.employment_type==='full_time'?[['slips','💰 বেতন স্লিপ']]:[])
    .concat([['study','📚 স্টাডি'],['docs','📄 নীতি ও দায়িত্ব'],['idcard','🪪 ID কার্ড'],['me','👤 প্রোফাইল']]);}
function shell(){
  var T=tabsFor();tab=T[0][0];
  $('#app').innerHTML='<div class="top"><div><b>☀ Trishna Staff</b><small>'+esc(me.full_name)+'</small></div><div class="sp"></div><span class="badge">'+esc(ROLE_S[me.role])+'</span><button class="btn alt sm" id="lo">লগআউট</button></div>'
   +'<div class="tabs" id="tabs"></div><main id="main"></main>';
  $('#lo').onclick=logout;
  $('#tabs').innerHTML=T.map(function(t){return '<button data-t="'+t[0]+'">'+t[1]+'</button>';}).join('');
  $('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)go(b.dataset.t);});
  go(tab);
}
function go(t){tab=t;[].forEach.call(document.querySelectorAll('#tabs button'),function(b){b.classList.toggle('on',b.dataset.t===t);});
  $('#main').innerHTML='<p>লোড হচ্ছে…</p>';
  var f=VIEWS[t];Promise.resolve().then(f).catch(function(e){$('#main').innerHTML='<div class="err">ত্রুটি: '+esc(e.message)+'</div>';});}
function main(html){var o=$('#main'),n=o.cloneNode(false);o.parentNode.replaceChild(n,o);n.innerHTML=html;return n;}   // fresh node each time so old click handlers never pile up

/* ---------- shared data ---------- */
function loadProfiles(){return sb.from('profiles').select('*').order('full_name').then(must).then(function(d){S.profiles=d;S.pm={};d.forEach(function(p){S.pm[p.id]=p;});return d;});}
function nm(id){var p=S.pm&&S.pm[id];return p?p.full_name:'—';}
function myMaterials(){return sb.from('materials').select('*').order('sort').then(must);}
function myProgress(uid){return sb.from('progress').select('*').eq('user_id',uid).then(must);}
function pct(mats,prog){var m={};prog.forEach(function(p){m[p.material_id]=p.status;});var d=0;mats.forEach(function(x){if(m[x.id]==='done')d++;});return mats.length?Math.round(d*100/mats.length):0;}

/* ================= EMPLOYEE VIEWS ================= */
var VIEWS={};
VIEWS.dash=function(){
  var today=ist(),ym=today.slice(0,7);
  return Promise.all([
    sb.from('attendance').select('*').eq('user_id',me.id).gte('work_date',monthStart(ym)).lte('work_date',monthEnd(ym)).order('work_date',{ascending:false}).then(must),
    sb.from('activities').select('*').eq('user_id',me.id).gte('activity_date',monthStart(ym)).order('created_at',{ascending:false}).then(must),
    myMaterials(),myProgress(me.id)
  ]).then(function(r){var att=r[0],act=r[1],mats=r[2],prog=r[3];
    var td=att.filter(function(a){return a.work_date===today;})[0];
    var hours=att.reduce(function(s,a){return s+hrs(a.check_in,a.check_out);},0);
    var p=pct(mats,prog);

function dtl(t){return t?new Date(t).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';}
function inr(n){return '₹'+Number(n||0).toLocaleString('en-IN');}
function rich(b){return String(b||'').split(/\n{2,}|\n(?=# )/).map(function(x){x=x.trim();if(!x)return '';
  if(/^# /.test(x)){var l=x.split('\n');return '<h4 style="margin:12px 0 4px">'+esc(l[0].slice(2))+'</h4>'+rich(l.slice(1).join('\n'));}
  if(/^- /m.test(x))return '<ul>'+x.split('\n').map(function(y){return y.replace(/^- /,'').trim()?'<li>'+esc(y.replace(/^- /,''))+'</li>':'';}).join('')+'</ul>';
  return '<p>'+esc(x).replace(/\n/g,'<br>')+'</p>';}).join('');}
function dirOpts(sel,extra){return (S.dir||[]).filter(function(d){return d.id!==me.id;}).map(function(d){return '<option value="'+d.id+'">'+esc(d.full_name)+' — '+esc(ROLE_S[d.role]||d.role)+'</option>';}).join('');}

VIEWS.customers=function(){

VIEWS.materials=function(){

      var done=function(){sb.from('materials').insert(rec).then(function(r){must(r);toast('যোগ হয়েছে ✔');go('materials');}).catch(function(er){toast(er.message);});};
      if(k!=='note'&&f){var path=Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');sb.storage.from('staff-files').upload(path,f).then(function(r){if(r.error){toast(r.error.message);return;}rec.file_path=path;done();});}
      else if(k!=='note'&&!rec.url){toast('লিংক বা ফাইল দিন');}else done();});

  });
};

/* ---------- notice board shown on home dashboards ---------- */
function boardHtml(items){if(!items.length)return '';
  var K={notice:'📢',banner:'📢',ad:'🎯',story:'🌟',motivation:'💡'};
  var card=function(x){return '<div class="card" style="margin:8px 0;'+(x.pinned?'border-left:5px solid #d97706;':'')+(x.kind==='motivation'?'background:linear-gradient(135deg,#fff7ed,#fffbeb);':'')+'">'+(x.image_url?'<img src="'+esc(x.image_url)+'" alt="" style="max-width:100%;max-height:220px;border-radius:10px;display:block;margin-bottom:8px">':'')+'<b>'+(K[x.kind]||'')+' '+esc(x.title)+'</b>'+(x.pinned?' <span class="pill y">📌</span>':'')+(x.body?'<div style="white-space:pre-wrap;margin-top:4px">'+esc(x.body)+'</div>':'')+(x.author_name?'<small>— '+esc(x.author_name)+'</small>':'')+(x.link_url&&/^https?:/.test(x.link_url)?'<div style="margin-top:6px"><a class="btn alt sm" target="_blank" rel="noopener" href="'+esc(x.link_url)+'">'+esc(x.link_label||'আরও জানুন')+'</a></div>':'')+'</div>';};
  return '<div id="nboard"><h3 style="margin:4px 0">🗞 নোটিস বোর্ড</h3>'+items.slice(0,6).map(card).join('')+'</div>';}
function loadBoard(){return sb.from('content_items').select('*').eq('published',true).in('audience',['public','staff']).order('pinned',{ascending:false}).order('sort').order('created_at',{ascending:false}).limit(12).then(function(r){return r.data||[];});}
function withBoard(name){var o=VIEWS[name];if(!o)return;VIEWS[name]=function(){return Promise.resolve(o()).then(function(){return loadBoard();}).then(function(items){var h=boardHtml(items),n=$('#main');if(n&&h&&!$('#nboard',n))n.insertAdjacentHTML('afterbegin',h);}).catch(function(){});};}
['home','dash','overview'].forEach(withBoard);

/* ---------- Content Studio ---------- */

   +'<div class="card scroll"><table><tr><th></th><th>শিরোনাম</th><th>ধরন</th><th>কাদের জন্য</th><th>অবস্থা</th><th></th></tr>'+(rows.map(function(x){return '<tr data-id="'+x.id+'"><td>'+(x.image_url?'<img src="'+esc(x.image_url)+'" style="width:46px;height:46px;object-fit:cover;border-radius:8px">':'')+'</td><td><b>'+esc(x.title)+'</b>'+(x.pinned?' 📌':'')+'<br><small>'+esc((x.body||'').slice(0,70))+'</small></td><td>'+esc(CK[x.kind])+'</td><td>'+esc(CA[x.audience])+'</td><td>'+(x.published?'<span class="pill g">প্রকাশিত</span>':'<span class="pill">লুকানো</span>')+(x.ends_on&&x.ends_on<ist().slice(0,10)?' <span class="pill y">মেয়াদ শেষ</span>':'')+'</td><td><button class="btn alt sm" data-ed="'+x.id+'">সম্পাদনা</button> <button class="btn alt sm" data-tg="'+x.id+'">'+(x.published?'লুকান':'প্রকাশ')+'</button> <button class="btn alt sm" data-dl="'+x.id+'">মুছুন</button></td></tr>';}).join('')||'<tr><td colspan="6">এখনো কিছু নেই।</td></tr>')+'</table></div>');
  function edit(x,kind){x=x||{kind:kind||'notice',audience:'public',published:true,pinned:false,sort:0};

     +'<label>শিরোনাম *</label><input id="k_title" value="'+esc(x.title||'')+'" maxlength="140"><label>বিবরণ</label><textarea id="k_body" rows="5">'+esc(x.body||'')+'</textarea>'
     +'<div class="row"><div><label>নাম/সূত্র (গল্পের ক্ষেত্রে, সম্মতি নিয়ে)</label><input id="k_auth" value="'+esc(x.author_name||'')+'"></div><div><label>লিংক (ঐচ্ছিক)</label><input id="k_link" value="'+esc(x.link_url||'')+'" placeholder="https://"></div><div><label>বোতামের লেখা</label><input id="k_ll" value="'+esc(x.link_label||'')+'"></div></div>'

/* ---------- Exam management (create exams, results, trust board, certificates) ---------- */
function parseQs(txt){var out=[];txt.split(/\n\s*\n/).forEach(function(blk){var lines=blk.split('\n').map(function(l){return l.trim();}).filter(Boolean);if(!lines.length)return;var q=lines[0].replace(/^\d+[.)]\s*/,''),opts=[],c=-1,ex='';
  lines.slice(1).forEach(function(l){if(/^(ব্যাখ্যা|explanation)\s*[:：]/i.test(l)){ex=l.replace(/^[^:：]*[:：]\s*/,'');}else if(/^[-•]/.test(l)){var o=l.replace(/^[-•]\s*/,'');if(/\*\s*$/.test(o)){c=opts.length;o=o.replace(/\s*\*\s*$/,'');}opts.push(o);}});
  if(q&&opts.length>=2&&c>=0)out.push({question:q,options:opts,correct:c,explanation:ex||null});else out.push({error:q});});return out;}
function qsToText(qs){return qs.map(function(q){return q.question+'\n'+q.options.map(function(o,i){return '- '+o+(i===q.correct?' *':'');}).join('\n')+(q.explanation?'\nব্যাখ্যা: '+q.explanation:'');}).join('\n\n');}

     +'<div class="card scroll"><h3>🏅 Trust Score বোর্ড (কর্মী)</h3><table><tr><th>কর্মী</th><th>পদ</th><th>স্কোর</th><th>লেভেল</th><th>সার্টিফিকেট</th></tr>'+(tb.map(function(t){return '<tr><td>'+esc(t.full_name)+'</td><td>'+esc(ROLE_S[t.role]||t.role)+(t.employment_type==='part_time'?' (PT)':'')+'</td><td><div class="bar" style="min-width:80px"><i style="width:'+t.total+'%"></i></div><small>'+t.total+'</small></td><td>'+esc(t.level)+'</td><td>'+t.certificates+'</td></tr>';}).join('')||'<tr><td colspan="5">তথ্য নেই</td></tr>')+'</table></div>'
     +'<div class="card scroll"><h3>সাম্প্রতিক ফলাফল</h3><table><tr><th>কে</th><th>ধরন</th><th>পরীক্ষা</th><th>স্কোর</th><th>ফল</th><th>কখন</th></tr>'+(res.map(function(x){return '<tr><td>'+esc(x.who)+'</td><td>'+(x.kind==='staff'?'কর্মী':'গ্রাহক')+'</td><td>'+esc(x.exam)+'</td><td>'+x.score+'%</td><td>'+(x.passed?'<span class="pill g">পাস</span>':'<span class="pill r">ফেল</span>')+'</td><td>'+fdt(x.at)+'</td></tr>';}).join('')||'<tr><td colspan="6">এখনো কেউ পরীক্ষা দেননি।</td></tr>')+'</table></div>'
     +'<div class="card scroll"><h3>ইস্যুকৃত সার্টিফিকেট</h3><table><tr><th>কোড</th><th>নাম</th><th>সার্টিফিকেট</th><th>স্কোর</th><th>তারিখ</th><th></th></tr>'+(certs.map(function(c){return '<tr><td><code>'+esc(c.code)+'</code></td><td>'+esc(c.holder_name)+' <small>('+(c.holder_kind==='staff'?'কর্মী':'গ্রাহক')+')</small></td><td>'+esc(c.cert_title||c.exam_title)+'</td><td>'+c.score_pct+'%</td><td>'+new Date(c.issued_at).toLocaleDateString('en-IN')+'</td><td>'+(c.revoked?'<span class="pill r">বাতিল</span>':'')+(cm?' <button class="btn alt sm" data-rv="'+c.id+'" data-v="'+(c.revoked?0:1)+'">'+(c.revoked?'পুনর্বহাল':'বাতিল করুন')+'</button>':'')+'</td></tr>';}).join('')||'<tr><td colspan="6">এখনো কিছু নেই।</td></tr>')+'</table></div>');
    function editExam(e){e=e||{audience:'staff',pass_percent:70,duration_min:10,published:true,sort:100};
      (e.id?sb.from('exam_questions').select('*').eq('exam_id',e.id).order('sort').order('id').then(must):Promise.resolve([])).then(function(qs){
        var md=modal('<h3>'+(e.id?'পরীক্ষা সম্পাদনা':'নতুন পরীক্ষা')+'</h3><label>শিরোনাম *</label><input id="e_t" value="'+esc(e.title||'')+'"><label>বিবরণ</label><input id="e_d" value="'+esc(e.description||'')+'"><div class="row"><div><label>কাদের জন্য</label><select id="e_a"><option value="staff"'+(e.audience==='staff'?' selected':'')+'>কর্মী</option><option value="customer"'+(e.audience==='customer'?' selected':'')+'>গ্রাহক</option><option value="all"'+(e.audience==='all'?' selected':'')+'>সবাই</option></select></div><div><label>নির্দিষ্ট পদ (ঐচ্ছিক)</label><select id="e_r"><option value="">সব পদ</option>'+Object.keys(ROLE_S).map(function(k){return '<option value="'+k+'"'+(e.role===k?' selected':'')+'>'+esc(ROLE_S[k])+'</option>';}).join('')+'</select></div><div><label>পাস %</label><input type="number" id="e_p" value="'+e.pass_percent+'"></div><div><label>সময় (মিনিট)</label><input type="number" id="e_m" value="'+e.duration_min+'"></div></div><label>সার্টিফিকেটের নাম</label><input id="e_c" value="'+esc(e.cert_title||'')+'" placeholder="যেমন: Solar Fundamentals Certificate">'

        $('#e_x',md).onclick=function(){md.remove();};
        if(e.id)$('#e_del',md).onclick=function(){if(confirm('পরীক্ষা, প্রশ্ন ও ফলাফল মুছে যাবে (সার্টিফিকেট থাকবে)। নিশ্চিত?'))sb.from('exams').delete().eq('id',e.id).then(function(){md.remove();go('exammgr');});};

          var rec={title:t,description:$('#e_d',md).value.trim()||null,audience:$('#e_a',md).value,role:$('#e_r',md).value||null,pass_percent:+$('#e_p',md).value||70,duration_min:+$('#e_m',md).value||10,cert_title:$('#e_c',md).value.trim()||null,published:$('#e_pub',md).checked};
